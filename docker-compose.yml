name: gameroute

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: gameroute
      POSTGRES_USER: gameroute
      POSTGRES_PASSWORD: gameroute
    ports:
      - 127.0.0.1:5432:5432
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, pg_isready -U gameroute -d gameroute]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  postgres-data:
